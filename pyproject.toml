[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "easysurv"
version = "2.1.0"
description = "Interactive Survival Analysis Platform for Clinical Research"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "streamlit>=1.28,<2.0",
    "pandas>=2.0,<3.0",
    "lifelines>=0.27,<1.0",
    "matplotlib>=3.7,<4.0",
    "openpyxl>=3.1,<4.0",
    "scikit-learn>=1.3,<2.0",
    "seaborn>=0.12,<1.0",
    "scipy>=1.11,<2.0",
    "numpy>=1.24,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
